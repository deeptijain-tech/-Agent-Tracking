<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">
    <title>M-Swasth Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- SheetJS for Excel (.xlsx, .xls) Support -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    
    <style>
        body { 
            background-color: #e2e8f0; 
            color: #1e293b; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
        }
        .header-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        /* 3D Card Effect */
        .card-3d { 
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border-radius: 16px; 
            padding: 24px; 
            box-shadow: 8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff;
            border: 1px solid #e2e8f0;
            border-bottom: 5px solid #cbd5e1;
            border-right: 2px solid #cbd5e1;
            transition: transform 0.2s ease;
        }
        .card-3d:hover {
            transform: translateY(-2px);
        }

        /* 3D Inner Elements */
        .inner-3d {
            background: #f8fafc;
            box-shadow: inset 4px 4px 8px #cbd5e1, inset -4px -4px 8px #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        .accent-orange { color: #ea580c; }
        .bg-accent-orange { background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%); }
        .accent-blue { color: #1e3a8a; }

        .filter-select { 
            background-color: #ffffff; 
            color: #1e293b; 
            border: 2px solid #cbd5e1; 
            border-bottom: 4px solid #94a3b8;
            border-radius: 10px; 
            padding: 12px 16px; 
            outline: none; 
            cursor: pointer;
            font-weight: 800;
            font-size: 1.1rem;
            min-width: 180px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.05);
            transition: all 0.1s;
        }
        .filter-select:active {
            border-bottom: 2px solid #94a3b8;
            transform: translateY(2px);
        }
        .filter-select:focus { border-color: #f59e0b; }

        /* 3D Button */
        .btn-3d {
            background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
            border-bottom: 4px solid #c2410c;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        .btn-3d:active {
            border-bottom: 0px solid #c2410c;
            transform: translateY(4px);
        }

        /* 3D Text Shadow */
        .text-3d {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
